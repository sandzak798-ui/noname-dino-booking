{% extends "base.html" %}{% block content %}
<section class="hero"><span class="eyebrow">ONLINE REZERVACIJA</span><h1>Vrijeme je za<br><em>novi look.</em></h1><p>Rezerviši svoj termin kod Dine brzo i jednostavno.</p></section>
<section class="card"><form method="post">
<label>01 — Izaberi datum</label><input type="date" name="date" id="date" value="{{date}}" min="{{today}}" required>
<label>02 — Izaberi uslugu</label><select name="service" id="service" required style="width:100%;padding:14px;margin-bottom:18px;background:#161616;color:white;border:1px solid #555;border-radius:8px">{% for key,label in services.items() %}<option value="{{key}}" {% if service==key %}selected{% endif %}>{{label}} — {{'60 min' if 'farbanje' in key else '30 min'}}</option>{% endfor %}</select>
<label>03 — Slobodni termini</label><div class="slots">{% for s in slots %}<label class="slot"><input type="radio" name="time" value="{{s}}" required><span>{{s}}</span></label>{% else %}<p class="muted">Nema slobodnih termina za ovaj datum i uslugu.</p>{% endfor %}</div>
<label>04 — Tvoji podaci</label><div class="grid"><input name="name" placeholder="Ime i prezime" required><input name="phone" placeholder="Broj telefona" required></div><button>REZERVIŠI TERMIN →</button>
</form></section>
<script>const d=document.getElementById('date'),s=document.getElementById('service');function refresh(){location='/?date='+encodeURIComponent(d.value)+'&service='+encodeURIComponent(s.value)}d.addEventListener('change',refresh);s.addEventListener('change',refresh);</script>
{% endblock %}
