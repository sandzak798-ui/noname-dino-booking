{% extends 'base.html' %}{% block content %}<section class="hero"><p class="eyebrow">ONLINE REZERVACIJA</p><h1>Vrijeme je za<br>novi <i>look.</i></h1><p>Rezerviši svoj termin kod Dine za manje od minute.</p></section><form class="card" method="post"><label>01 — Izaberi datum</label><input type="date" name="date" min="{{today}}" value="{{date}}" onchange="location='/?date='+this.value"><label>02 — Slobodni termini</label><div class="slots">{% for s in slots %}<label class="slot"><input type="radio" name="time" value="{{s}}" required><span>{{s}}</span></label>{% else %}<p>Nema slobodnih termina za ovaj dan.</p>{% endfor %}</div><label>03 — Tvoji podaci</label><input name="name" placeholder="Ime i prezime" required><input name="phone" placeholder="Broj telefona" required><button>REZERVIŠI TERMIN →</button></form>{% endblock %}
