{% extends "base.html" %}{% block content %}<section class="hero"><span class="eyebrow">ONLINE REZERVACIJA</span><h1>Vrijeme je za<br><em>novi look.</em></h1><p>Rezerviši svoj termin kod Dine brzo i jednostavno.</p></section><section class="card"><form method="post"><label>01 — Izaberi datum</label><input type="date" name="date" id="date" value="{{date}}" min="{{today}}" required><label>02 — Slobodni termini</label><div class="slots">{% for s in slots %}<label class="slot"><input type="radio" name="time" value="{{s}}" required><span>{{s}}</span></label>{% else %}<p class="muted">Nema slobodnih termina.</p>{% endfor %}</div><label>03 — Tvoji podaci</label><div class="grid"><input name="name" placeholder="Ime i prezime" required><input name="phone" placeholder="Broj telefona" required></div><button>REZERVIŠI TERMIN →</button></form></section><script>date.onchange=e=>location='/?date='+e.target.value</script>{% endblock %}
