{% extends "base.html" %}{% block content %}<div class="adminbar"><div><a class="link" href="{{url_for('admin')}}">← Nazad</a><h1>Trajni termin</h1></div></div><section class="card"><p class="muted">Termin će biti rezervisan svake sedmice. Standardno se kreira za narednih 52 sedmice.</p><form method="post"><label>Klijent</label><div class="grid"><input name="name" placeholder="Ime i prezime" required><input name="phone" placeholder="Broj telefona" required></div><label>Prvi termin</label><div class="grid"><input type="date" name="start" min="{{today}}" required><select name="time">{% for s in slots %}<option>{{s}}</option>{% endfor %}</select></div><label>Broj sedmica</label><input type="number" name="weeks" value="52" min="1" max="156"><button>KREIRAJ TRAJNI TERMIN →</button></form></section>{% endblock %}
