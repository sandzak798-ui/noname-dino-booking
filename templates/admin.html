{% extends 'base.html' %}{% block content %}<section class="adminhead"><div><p class="eyebrow">DINO ADMIN</p><h1>Termini</h1></div><a href="/admin/logout">Odjava</a></section><form class="datepick"><input type="date" name="date" value="{{date}}" onchange="this.form.submit()"></form><div class="list">{% for b in bookings %}<article><div class="time">{{b.time}}</div><div><b>{{b.name}}</b><small>{{b.phone}}</small></div><form method="post" action="/admin/delete/{{b.id}}" onsubmit="return confirm('Otkazati termin?')"><button class="delete">Otkaži</button></form></article>{% else %}<div class="empty">Nema rezervacija za ovaj dan.</div>{% endfor %}</div>{% endblock %}
