{% extends "base.html" %}{% block content %}
<section class="card"><h1>Trajni termin</h1><form method="post">
<label>Ime i prezime</label><input name="name" required>
<label>Telefon</label><input name="phone" required>
<label>Početni datum</label><input type="date" name="start" min="{{today}}" value="{{today}}" required>
<label>Usluga</label><select name="service" required style="width:100%;padding:12px">{% for key,label in services.items() %}<option value="{{key}}">{{label}} — {{'60 min' if 'farbanje' in key else '30 min'}}</option>{% endfor %}</select>
<label>Vrijeme</label><select name="time" required style="width:100%;padding:12px">{% for s in slots %}<option value="{{s}}">{{s}}</option>{% endfor %}</select>
<label>Broj sedmica</label><input type="number" name="weeks" min="1" max="104" value="52" required>
<button>SAČUVAJ TRAJNI TERMIN</button></form></section>
{% endblock %}
