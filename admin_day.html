{% extends "base.html" %}{% block content %}<div class="adminbar"><div><a class="link" href="{{url_for('admin')}}">← Mjesec</a><h1>{{day}}</h1></div><a class="smallbtn" href="{{url_for('recurring')}}">+ Trajni termin</a></div><section class="card timeline">{% for tm in slots %}{% set b=bytime.get(tm) %}<article><div class="time">{{tm}}</div>{% if b %}<div class="person"><b>{{b.name}} {% if b.recurring %}<span title="Trajni termin">🔁</span>{% endif %}</b><small>{{b.phone}}</small><form method="post" action="{{url_for('set_status',bid=b.id)}}"><select name="status" onchange="this.form.submit()">{% for key,label in statuses.items() %}<option value="{{key}}" {% if b.status==key %}selected{% endif %}>{{label}}</option>{% endfor %}</select></form></div><form method="post" action="{{url_for('delete',bid=b.id)}}" onsubmit="return confirm('Obrisati termin?')"><button class="delete">Obriši</button></form>{% else %}<div class="free">SLOBODNO</div>{% endif %}</article>{% endfor %}</section>{% endblock %}
